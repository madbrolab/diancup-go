services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.30.0
    restart: unless-stopped
    ports:
      - ${HTTP_PORT:-9925}:9000
    mem_limit: 1000m
    volumes:
      - ./data:/app/data/
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      ALLOW_SIGNUP: "false"
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      BASE_URL: ${PUBLIC_URL:?请填写 PUBLIC_URL}
      DB_ENGINE: postgres
      POSTGRES_USER: mealie
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请填写 DB_PASSWORD}
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: mealie
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: mealie
      POSTGRES_DB: mealie
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请填写 DB_PASSWORD}
    volumes:
      - ./postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD
        - pg_isready
        - -U
        - mealie
        - -d
        - mealie
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
