services:
  gitea:
    image: gitea/gitea:1
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
      - "${SSH_PORT:-2222}:22"
    environment:
      USER_UID: ${PUID:-1000}
      USER_GID: ${PGID:-1000}
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: db:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD: ${DB_PASSWORD:?请填写数据库密码}
      GITEA__server__SSH_PORT: ${SSH_PORT:-2222}
    volumes:
      - ./gitea:/data
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gitea
      POSTGRES_USER: gitea
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请填写数据库密码}
    volumes:
      - ./database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U gitea -d gitea"]
      interval: 10s
      timeout: 5s
      retries: 10
