services:
  filecodebox:
    image: lanol/filecodebox:2.8.5
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    ports:
      - ${HTTP_PORT:-12345}:12345
    environment:
      - APP_ENV=production
      - LOG_LEVEL=warning
      - ACCESS_LOG=false
      - WORKERS=1
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
