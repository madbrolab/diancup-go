services:
  nginx:
    image: nginx:latest
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - 80:80
    volumes:
      - ./volumes/nginx/conf.d:/etc/nginx/conf.d
  api:
    image: langgenius/dify-api:latest
    restart: unless-stopped
    depends_on:
      - db
      - redis
    volumes:
      - ./volumes/app/storage:/app/api/storage
    environment:
      - SECRET_KEY=${SECRET_KEY:?请填写 SECRET_KEY}
      - DB_USERNAME=postgres
      - DB_PASSWORD=${DB_PASSWORD:?请填写 DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=dify
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - VECTOR_STORE=weaviate
      - WEAVIATE_ENDPOINT=http://weaviate:8080
  worker:
    image: langgenius/dify-api:latest
    restart: unless-stopped
    depends_on:
      - api
    command: celery -A app.celery worker -P gevent -c 1
    environment:
      - DB_USERNAME=postgres
      - DB_PASSWORD=${DB_PASSWORD:?请填写 DB_PASSWORD}
      - DB_HOST=db
      - DB_DATABASE=dify
      - REDIS_HOST=redis
  web:
    image: langgenius/dify-web:latest
    restart: unless-stopped
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - ./volumes/db/data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:?请填写 DB_PASSWORD}
      - POSTGRES_DB=dify
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - ./volumes/redis/data:/data
  weaviate:
    image: semitechnologies/weaviate:1.24.4
    restart: unless-stopped
    volumes:
      - ./volumes/weaviate:/var/lib/weaviate
    environment:
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true
