services:
  prepare:
    image: ghcr.io/linguo2625469/workbuddy2api-panel:latest
    user: 0:0
    restart: no
    environment:
      PUID: ${PUID:-10001}
      PGID: ${PGID:-10001}
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |-
        if [ ! -f /persist/config/config.json ]; then cp /app/config.json /persist/config/config.json; fi
        chown -R "$$PUID:$$PGID" /persist/config /persist/auths /persist/data
    volumes:
      - ./config:/persist/config
      - ./auths:/persist/auths
      - ./data:/persist/data
    healthcheck:
      disable: true
  wb2api:
    image: ghcr.io/linguo2625469/workbuddy2api-panel:latest
    restart: unless-stopped
    user: ${PUID:-10001}:${PGID:-10001}
    entrypoint:
      - /app/wb2api
      - -config
      - /app/config/config.json
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      WB2A_LISTEN: :7863
      WB2A_API_KEY: ${API_KEY:?请填写 API_KEY}
      WB2A_AUTH_DIR: /app/auths
      WB2A_STATE_FILE: /app/data/state.json
    ports:
      - ${HTTP_PORT:-7863}:7863
    depends_on:
      prepare:
        condition: service_completed_successfully
    volumes:
      - ./config:/app/config
      - ./auths:/app/auths
      - ./data:/app/data
