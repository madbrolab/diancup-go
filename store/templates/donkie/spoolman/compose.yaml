services:
  prepare:
    image: ghcr.io/donkie/spoolman:latest
    user: 0:0
    restart: no
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - chown "$$PUID:$$PGID" /home/app/.local/share/spoolman
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - ./data:/home/app/.local/share/spoolman
  app:
    image: ghcr.io/donkie/spoolman:latest
    restart: unless-stopped
    ports:
      - ${HTTP_PORT:-7912}:8000
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - ./data:/home/app/.local/share/spoolman
    depends_on:
      prepare:
        condition: service_completed_successfully
