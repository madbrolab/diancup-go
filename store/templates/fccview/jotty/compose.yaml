services:
  jotty:
    image: ghcr.io/fccview/jotty:latest
    user: 1000:1000
    ports:
      - 3122:3000
    volumes:
      - ./data:/app/data:rw
      - ./config:/app/config:rw
      - ./cache:/app/.next/cache:rw
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      default:
        aliases:
          - jotty
