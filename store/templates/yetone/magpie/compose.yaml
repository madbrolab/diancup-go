services:
  prepare:
    image: ghcr.io/yetone/magpie:latest
    user: 0:0
    restart: no
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - chown 65532:65532 /config
    volumes:
      - ./config:/config
  magpie:
    image: ghcr.io/yetone/magpie:latest
    restart: unless-stopped
    ports:
      - ${BIND_IP:-0.0.0.0}:${GATEWAY_PORT:-3425}:3425
      - ${BIND_IP:-0.0.0.0}:${WEB_PORT:-3430}:3430
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MAGPIE_ADDR: 0.0.0.0:3425
      MAGPIE_PUBLIC_URL: ${PUBLIC_URL:?请填写 PUBLIC_URL}
      MAGPIE_WEB_KEY: ${MAGPIE_WEB_KEY:?请填写 MAGPIE_WEB_KEY}
    volumes:
      - ./config:/config
    command:
      - web
      - --addr
      - 0.0.0.0:3430
      - --no-open
    depends_on:
      prepare:
        condition: service_completed_successfully
