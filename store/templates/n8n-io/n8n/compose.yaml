services:
  n8n:
    ports:
      - 35678:5678
    volumes:
      - ./data/n8n_data:/home/node/.n8n
    environment:
      - N8N_SECURE_COOKIE=false
      - GENERIC_TIMEZONE=Asia/Shanghai
      - HTTP_PROXY=http://192.168.0.1:7890
      - HTTPS_PROXY=http://192.168.0.1:7890
    image: docker.n8n.io/n8nio/n8n
