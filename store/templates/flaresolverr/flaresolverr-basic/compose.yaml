services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_HTML: "false"
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8191}:8191
    volumes:
      - ./config:/config
    tmpfs:
      - /tmp:size=256M,mode=1777
