services:
  affine:
    image: ghcr.io/toeverything/affine:stable
    restart: unless-stopped
    ports:
      - ${HTTP_PORT:-3010}:3010
    environment: &a1
      TZ: ${TZ:-Asia/Shanghai}
      REDIS_SERVER_HOST: redis
      DATABASE_URL: postgresql://affine:${DB_PASSWORD:?请填写 DB_PASSWORD}@postgres:5432/affine
      DEPLOYMENT_TYPE: selfhosted
    volumes: &a2
      - ./storage:/root/.affine/storage
      - ./config:/root/.affine/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      affine_migration:
        condition: service_completed_successfully
  affine_migration:
    image: ghcr.io/toeverything/affine:stable
    restart: no
    command:
      - sh
      - -c
      - node ./scripts/self-host-predeploy.js
    environment: *a1
    volumes: *a2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: affine
      POSTGRES_DB: affine
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请填写 DB_PASSWORD}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - ./postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U affine -d affine
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - ./cache:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
