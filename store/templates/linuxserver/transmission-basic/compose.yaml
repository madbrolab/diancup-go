services:
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      UMASK: ${UMASK:-022}
      USER: ${RPC_USER:-admin}
      PASS: ${RPC_PASSWORD:?请填写 RPC_PASSWORD}
      PEERPORT: ${PEER_PORT:-51413}
    ports:
      - ${HTTP_PORT:-9091}:9091
      - ${PEER_PORT:-51413}:${PEER_PORT:-51413}/tcp
      - ${PEER_PORT:-51413}:${PEER_PORT:-51413}/udp
    volumes:
      - ./config:/config
      - ./watch:/watch
      - ${DOWNLOADS_DIR:-./downloads}:/downloads
