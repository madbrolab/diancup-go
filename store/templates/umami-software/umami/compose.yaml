services:
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - 3001:3000
    environment:
      - DATABASE_URL=postgresql://umami:${DB_PASSWORD:?请填写 DB_PASSWORD}@db:5432/umami
      - DATABASE_TYPE=postgresql
      - APP_SECRET=${APP_SECRET:?请填写 APP_SECRET}
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - ./umami-db:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=umami
      - POSTGRES_USER=umami
      - POSTGRES_PASSWORD=${DB_PASSWORD:?请填写 DB_PASSWORD}
